name: CI

# Triggers: every push to main, every pull request into main, manual runs, and reuse by
# other workflows (release.yml calls this one so a release can never skip the checks).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# A new push to the same PR cancels the older run. On main and tags we let runs finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress --show-version

jobs:
  lint:
    name: Code style (Checkstyle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate project configuration
        run: mvn validate
      - name: Run Checkstyle
        run: mvn checkstyle:check@checkstyle

  static-analysis:
    name: Static analysis (SpotBugs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and run SpotBugs
        run: mvn compile spotbugs:check@spotbugs

  test:
    name: Test (Java ${{ matrix.java }})
    # Later stages must not run if the cheap early checks failed.
    needs: [lint, static-analysis]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Java 25 is a compatibility probe: a failure there is reported but does not block merges.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      # Let every matrix leg finish so one failure does not hide another.
      fail-fast: false
      matrix:
        java: ['21']
        experimental: [false]
        include:
          - java: '25'
            experimental: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java ${{ matrix.java }} with Maven cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Style and static analysis already ran once above; do not repeat them per matrix leg.
      - name: Run tests, coverage report and coverage gate
        run: mvn verify -Dcheckstyle.skip=true -Dspotbugs.skip=true
      - name: Upload test and coverage reports
        if: always() && matrix.java == '21'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-java-${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package and smoke-test JAR
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the executable JAR
        run: mvn package -DskipTests -Dcheckstyle.skip=true -Dspotbugs.skip=true -Djacoco.skip=true
      - name: Smoke-test the packaged JAR
        run: |
          set -euo pipefail
          jar=$(ls target/piperzip-*.jar | grep -v -- '-sources' | head -n 1)
          java -jar "$jar" --version
          work=$(mktemp -d)
          seq 1 50000 > "$work/input.txt"
          java -jar "$jar" compress "$work/input.txt" "$work/input.gz" --verify
          java -jar "$jar" decompress "$work/input.gz" "$work/restored.txt"
          java -jar "$jar" verify "$work/input.txt" "$work/restored.txt"
      - name: Upload JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piperzip-jar
          path: target/piperzip-*.jar
          if-no-files-found: error
          retention-days: 14
