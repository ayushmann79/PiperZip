name: Release

# Runs only when a version tag is pushed. Pull requests can never trigger it.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MAVEN_ARGS: --batch-mode --no-transfer-progress

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate version, branch and POM
        id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a semantic version like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          version="${TAG#v}"
          pom_version=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "$pom_version" != "$version" ]; then
            echo "::error::Tag version '$version' does not match pom.xml version '$pom_version'"; exit 1
          fi
          git fetch origin main --depth=1000
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit is not on the main branch"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  checks:
    name: Full CI on the tagged commit
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish GitHub Release
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the only job that may create a release
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build release JAR (timestamp = commit date, for reproducibility)
        run: |
          set -euo pipefail
          ts=$(git log -1 --format=%cI)
          mvn package -DskipTests -Dcheckstyle.skip=true -Dspotbugs.skip=true -Djacoco.skip=true "-Dproject.build.outputTimestamp=$ts"
      - name: Prepare versioned assets and SHA-256 checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release
          cp "target/piperzip-${VERSION}.jar" "release/piperzip-${VERSION}.jar"
          (cd release && sha256sum "piperzip-${VERSION}.jar" > SHA256SUMS && cat SHA256SUMS)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* --title "PiperZip $TAG" --generate-notes --verify-tag "${flags[@]}"
